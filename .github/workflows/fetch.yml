name: Fetch VISReg radar data

on:
  schedule:
        # Mon and Thu 07:17 UTC (10:17 or 09:17 Israel time). GitHub often starts scheduled jobs
    # hours late, so this leaves ~13 h before the 23:47 (Israel) Claude run.
    - cron: "17 7 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python fetch.py
      - name: Commit result
        run: |
          git config user.name "visreg-radar-bot"
          git config user.email "visreg-radar-bot@users.noreply.github.com"
          git add data/*.json
          git commit -m "Update radar data $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push
